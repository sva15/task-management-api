name: Task Management API - DevSecOps Pipeline

on:
  push:
    branches: [ "feature/**", "develop" ]  # Only feature branches and develop
  pull_request:
    branches: [ "main", "develop" ]

env:
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: '90'

# Concurrency control: Cancel push events when PR exists for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    outputs:
      formatting-status: ${{ steps.formatting.outcome }}
      linting-status: ${{ steps.linting.outcome }}
      typing-status: ${{ steps.typing.outcome }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install black isort flake8 mypy

    - name: Code Formatting Check
      id: formatting
      continue-on-error: true
      run: |
        echo "::group::Black Code Formatting"
        black --check --diff .
        echo "::endgroup::"
        
        echo "::group::Import Sorting"
        isort --check-only --diff .
        echo "::endgroup::"

    - name: Code Quality Check
      id: linting
      continue-on-error: true
      run: |
        echo "::group::Flake8 Linting"
        flake8 . --count --max-complexity=10 --max-line-length=88 --statistics
        echo "::endgroup::"

    - name: Type Checking
      id: typing
      continue-on-error: true
      run: |
        echo "::group::MyPy Type Checking"
        mypy . --ignore-missing-imports
        echo "::endgroup::"

    - name: Code Quality Summary
      if: always()
      run: |
        echo "Code Quality Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "============================" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Black Formatting | ${{ steps.formatting.outcome == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Import Sorting | ${{ steps.formatting.outcome == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Flake8 Linting | ${{ steps.linting.outcome == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| MyPy Type Analysis | ${{ steps.typing.outcome == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  testing:
    name: Testing & Coverage
    runs-on: ubuntu-latest
    needs: code-quality
    outputs:
      coverage-percentage: ${{ steps.coverage-summary.outputs.percentage }}
      test-status: ${{ steps.run-tests.outcome }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install pytest coverage

    - name: Run Tests with Coverage
      id: run-tests
      run: |
        echo "::group::Running Tests with Coverage"
        python -m coverage run -m pytest tests/ -v
        echo "::endgroup::"
        
        echo "::group::Generating Coverage Reports"
        python -m coverage xml
        python -m coverage report
        echo "::endgroup::"

    - name: Generate Coverage Summary
      id: coverage-summary
      if: always()
      run: |
        TOTAL_COVERAGE=$(python -m coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
        
        if [ -z "$TOTAL_COVERAGE" ] || [ "$TOTAL_COVERAGE" = "" ]; then
          TOTAL_COVERAGE="0.0"
          echo "Warning: Could not extract coverage, setting to 0.0%"
        fi
        
        echo "percentage=$TOTAL_COVERAGE" >> $GITHUB_OUTPUT
        
        REPORT="Coverage Report
        ===============

        Total Coverage: ${TOTAL_COVERAGE}%

        Module-wise Coverage:
        \`\`\`
        $(python -m coverage report --skip-covered --omit=\"*/tests/*\" | head -15)
        \`\`\`

        Missing Lines: $(python -m coverage report --format=missing | wc -l) lines"
                
                echo "report<<EOF" >> $GITHUB_OUTPUT
                echo "$REPORT" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

    - name: Check Coverage Threshold
      if: always()
      run: |
        COVERAGE="${{ steps.coverage-summary.outputs.percentage }}"
        if awk "BEGIN {exit !($COVERAGE < ${{ env.COVERAGE_THRESHOLD }})}"; then
          echo "Error: Coverage ${COVERAGE}% is below required ${{ env.COVERAGE_THRESHOLD }}% threshold"
          exit 1
        else
          echo "Coverage ${COVERAGE}% meets required threshold"
        fi

    - name: Upload Coverage Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: coverage.xml
        retention-days: 7

    - name: Testing Summary
      if: always()
      run: |
        TEST_STATUS="${{ steps.run-tests.outcome }}"
        COVERAGE="${{ steps.coverage-summary.outputs.percentage }}"
        
        echo "Testing Results" >> $GITHUB_STEP_SUMMARY
        echo "===============" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Test Execution | $([[ '$TEST_STATUS' == 'success' ]] && echo 'PASSED' || echo 'FAILED') |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Coverage | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
        echo "| Coverage Threshold | $([[ '$TEST_STATUS' == 'success' ]] && echo 'PASSED (≥${{ env.COVERAGE_THRESHOLD }}%)' || echo 'FAILED (<${{ env.COVERAGE_THRESHOLD }}%)') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  security-scans:
    name: Security Analysis
    runs-on: ubuntu-latest
    outputs:
      pip-audit-status: ${{ steps.deps-scan.outputs.pip-audit-status }}
      safety-status: ${{ steps.deps-scan.outputs.safety-status }}
      bandit-status: ${{ steps.sast-scan.outputs.bandit-status }}
      secret-scan-status: ${{ steps.secret-scan.outcome }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install bandit safety pip-audit

    - name: Dependency Security Scan
      id: deps-scan
      continue-on-error: true
      run: |
        echo "::group::Pip Audit"
        pip-audit --format=json --output=pip-audit-report.json || true
        PIPAUDIT_EXIT=$?
        echo "::endgroup::"
        
        echo "::group::Safety Check"
        safety check --json --output safety-report.json || true
        SAFETY_EXIT=$?
        echo "::endgroup::"
        
        echo "pip-audit-status=$([[ $PIPAUDIT_EXIT -eq 0 ]] && echo 'passed' || echo 'failed')" >> $GITHUB_OUTPUT
        echo "safety-status=$([[ $SAFETY_EXIT -eq 0 ]] && echo 'passed' || echo 'failed')" >> $GITHUB_OUTPUT

    - name: SAST Security Scan
      id: sast-scan
      continue-on-error: true
      run: |
        echo "::group::Bandit Security Scan"
        bandit -r . -f json -o bandit-report.json || true
        BANDIT_EXIT=$?
        echo "::endgroup::"
        
        echo "bandit-status=$([[ $BANDIT_EXIT -eq 0 ]] && echo 'passed' || echo 'failed')" >> $GITHUB_OUTPUT

    - name: Secret Scanning
      id: secret-scan
      continue-on-error: true
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Security Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          pip-audit-report.json
          safety-report.json
          bandit-report.json
        retention-days: 7

    - name: Security Analysis Summary
      if: always()
      run: |
        echo "Security Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "========================" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Audit | ${{ steps.deps-scan.outputs.pip-audit-status == 'passed' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Safety Check | ${{ steps.deps-scan.outputs.safety-status == 'passed' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| SAST Analysis | ${{ steps.sast-scan.outputs.bandit-status == 'passed' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Detection | ${{ steps.secret-scan.outcome == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.pull_request.base.ref == 'main'
    needs: [testing]
    continue-on-error: true
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Coverage Reports
      uses: actions/download-artifact@v4
      with:
        name: coverage-reports

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: SonarQube Analysis
      uses: SonarSource/sonarqube-scan-action@v5.3.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.sources=src
          -Dsonar.tests=tests

  pr-comment:
    name: PR Comment with Results
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref != 'main' &&  
      always()
    needs: [code-quality, testing, security-scans]
    permissions:
      pull-requests: write
      contents: read
    
    steps:
    - name: Comment PR with Results
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          Task Management API - DevSecOps Pipeline Results
          ================================================

          Test Coverage
          -------------
          | Metric | Value |
          |--------|-------|
          | Coverage Percentage | **${{ needs.testing.outputs.coverage-percentage }}%** |
          | Coverage Status | ${{ needs.testing.outputs.test-status == 'success' && 'PASSED' || 'FAILED' }} |

          Code Quality Analysis
          --------------------
          | Check | Status |
          |-------|--------|
          | Code Formatting | ${{ needs.code-quality.outputs.formatting-status == 'success' && 'PASSED' || 'FAILED' }} |
          | Code Linting | ${{ needs.code-quality.outputs.linting-status == 'success' && 'PASSED' || 'FAILED' }} |
          | Type Checking | ${{ needs.code-quality.outputs.typing-status == 'success' && 'PASSED' || 'FAILED' }} |

          Security Analysis
          -----------------
          | Scan Type | Status |
          |-----------|--------|
          | Dependency Audit | ${{ needs.security-scans.outputs.pip-audit-status == 'passed' && 'PASSED' || 'FAILED' }} |
          | Safety Check | ${{ needs.security-scans.outputs.safety-status == 'passed' && 'PASSED' || 'FAILED' }} |
          | SAST Analysis | ${{ needs.security-scans.outputs.bandit-status == 'passed' && 'PASSED' || 'FAILED' }} |
          | Secret Detection | ${{ needs.security-scans.outputs.secret-scan-status == 'success' && 'PASSED' || 'FAILED' }} |

          Pipeline Summary
          ----------------
          Overall Status: ${{ needs.code-quality.result == 'success' && needs.testing.result == 'success' && needs.security-scans.result == 'success' && 'ALL CHECKS PASSED' || 'SOME CHECKS FAILED' }}

          Build Details: [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---
          Pipeline executed for commit: ${{ github.event.pull_request.head.sha }}