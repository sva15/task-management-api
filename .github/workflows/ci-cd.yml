name: Task Management API - DevSecOps Pipeline

on:
  push:
    branches-ignore: [ "main", "develop" ]  # Feature branches only
  pull_request:
    branches: [ "main", "develop" ]
    types: [opened, synchronize, reopened]
  # Strategy to handle duplicate runs:
  # - Both push and PR events are needed for different scenarios
  # - Concurrency group ensures PR events take precedence over push events
  # - When PR exists: PR event cancels any running push event

env:
  PYTHON_VERSION: '3.11'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      formatting-status: ${{ steps.formatting.outcome }}
      linting-status: ${{ steps.linting.outcome }}
      typing-status: ${{ steps.typing.outcome }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install black isort flake8 mypy

    - name: Code Formatting Check
      id: formatting
      continue-on-error: true
      run: |
        echo "::group::Black Code Formatting"
        black --check --diff . || BLACK_EXIT=$?
        echo "::endgroup::"
        
        echo "::group::Import Sorting"
        isort --check-only --diff . || ISORT_EXIT=$?
        echo "::endgroup::"

    - name: Code Quality Check
      id: linting
      continue-on-error: true
      run: |
        echo "::group::Flake8 Linting"
        flake8 . --count --max-complexity=10 --max-line-length=88 --statistics || FLAKE8_EXIT=$?
        echo "::endgroup::"

    - name: Type Checking
      id: typing
      continue-on-error: true
      run: |
        echo "::group::MyPy Type Checking"
        mypy . --ignore-missing-imports || MYPY_EXIT=$?
        echo "::endgroup::"

    - name: Code Quality Summary
      if: always()
      run: |
        # Get exit codes from previous steps
        BLACK_STATUS="${{ steps.formatting.outcome }}"
        ISORT_STATUS="${{ steps.formatting.outcome }}"
        FLAKE8_STATUS="${{ steps.linting.outcome }}"
        MYPY_STATUS="${{ steps.typing.outcome }}"
        
        echo "## Code Quality Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Black Formatting | $([[ $BLACK_STATUS == 'success' ]] && echo 'PASSED' || echo 'FAILED') |" >> $GITHUB_STEP_SUMMARY
        echo "| Import Sorting | $([[ $ISORT_STATUS == 'success' ]] && echo 'PASSED' || echo 'FAILED') |" >> $GITHUB_STEP_SUMMARY
        echo "| Flake8 Linting | $([[ $FLAKE8_STATUS == 'success' ]] && echo 'PASSED' || echo 'FAILED') |" >> $GITHUB_STEP_SUMMARY
        echo "| MyPy Type Analysis | $([[ $MYPY_STATUS == 'success' ]] && echo 'PASSED' || echo 'FAILED') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  testing:
    name: Testing & Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      coverage: ${{ steps.tests.outputs.coverage }}
      test-status: ${{ steps.tests.outcome }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pytest-cov

    - name: Run Tests with Coverage
      id: tests
      continue-on-error: true
      run: |
        echo "::group::Running Tests"
        pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing || PYTEST_EXIT=$?
        echo "::endgroup::"
        
        # Extract coverage percentage and test results
        COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f'{float(root.attrib[\"line-rate\"]) * 100:.1f}')" 2>/dev/null || echo "N/A")
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

    - name: Testing Summary
      if: always()
      run: |
        TEST_STATUS="${{ steps.tests.outcome }}"
        COVERAGE="${{ steps.tests.outputs.coverage }}"
        
        echo "## Testing Results" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Test Execution | $([[ $TEST_STATUS == 'success' ]] && echo 'PASSED' || echo 'FAILED') |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Coverage | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
        echo "| Test Failures | $([[ $TEST_STATUS == 'success' ]] && echo 'None' || echo 'Yes - Check logs for details') |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  security-scans:
    name: Security Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      pip-audit-status: ${{ steps.deps-scan.outputs.pip-audit-status }}
      safety-status: ${{ steps.deps-scan.outputs.safety-status }}
      bandit-status: ${{ steps.sast-scan.outputs.bandit-status }}
      secret-scan-status: ${{ steps.secret-scan.outcome }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for secret scanning

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install bandit safety pip-audit

    - name: Dependency Security Scan
      id: deps-scan
      continue-on-error: true
      run: |
        echo "::group::Pip Audit"
        pip-audit --format=json --output=pip-audit-report.json || true
        PIPAUDIT_EXIT=$?
        echo "::endgroup::"
        
        echo "::group::Safety Check"
        safety check --json --output safety-report.json || true
        SAFETY_EXIT=$?
        echo "::endgroup::"
        
        # Set outputs
        echo "pip-audit-status=$([[ $PIPAUDIT_EXIT -eq 0 ]] && echo 'passed' || echo 'failed')" >> $GITHUB_OUTPUT
        echo "safety-status=$([[ $SAFETY_EXIT -eq 0 ]] && echo 'passed' || echo 'failed')" >> $GITHUB_OUTPUT

    - name: SAST Security Scan
      id: sast-scan
      continue-on-error: true
      run: |
        echo "::group::Bandit Security Scan"
        bandit -r . -f json -o bandit-report.json || true
        BANDIT_EXIT=$?
        bandit -r . -f txt || true
        echo "::endgroup::"
        
        echo "bandit-status=$([[ $BANDIT_EXIT -eq 0 ]] && echo 'passed' || echo 'failed')" >> $GITHUB_OUTPUT

    - name: Secret Scanning
      id: secret-scan
      continue-on-error: true
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Security Analysis Summary
      if: always()
      run: |
        echo "## Security Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Audit | ${{ steps.deps-scan.outputs.pip-audit-status == 'passed' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Safety Check | ${{ steps.deps-scan.outputs.safety-status == 'passed' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| SAST Analysis | ${{ steps.sast-scan.outputs.bandit-status == 'passed' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Detection | ${{ steps.secret-scan.outcome == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    needs: [testing]
    continue-on-error: true
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for SonarQube

    - name: Download Coverage Reports
      uses: actions/download-artifact@v4
      with:
        name: coverage-reports

    - name: SonarQube Analysis
      uses: SonarSource/sonarqube-scan-action@v5.3.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        scanMetadataReportFile: target/sonar/report-task.txt

  pr-comment:
    name: PR Comment with Results
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    needs: [code-quality, testing, security-scans]
    permissions:
      pull-requests: write
      contents: read
    
    steps:
    - name: Comment PR with Results
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ## Task Management API - DevSecOps Pipeline Results
          
          ### Test Coverage
          | Metric | Value |
          |--------|-------|
          | Coverage Percentage | **${{ needs.testing.outputs.coverage }}%** |
          
          ### Code Quality Analysis
          | Check | Status |
          |-------|--------|
          | Code Formatting | ${{ needs.code-quality.outputs.formatting-status == 'success' && 'PASSED' || 'FAILED' }} |
          | Code Linting | ${{ needs.code-quality.outputs.linting-status == 'success' && 'PASSED' || 'FAILED' }} |
          | Type Checking | ${{ needs.code-quality.outputs.typing-status == 'success' && 'PASSED' || 'FAILED' }} |
          
          ### Testing Results
          | Test Type | Status |
          |-----------|--------|
          | Unit Tests | ${{ needs.testing.outputs.test-status == 'success' && 'PASSED' || 'FAILED' }} |
          
          ### Security Analysis
          | Scan Type | Status |
          |-----------|--------|
          | Dependency Audit (pip-audit) | ${{ needs.security-scans.outputs.pip-audit-status == 'passed' && 'PASSED' || 'FAILED' }} |
          | Dependency Safety Check | ${{ needs.security-scans.outputs.safety-status == 'passed' && 'PASSED' || 'FAILED' }} |
          | SAST Analysis (bandit) | ${{ needs.security-scans.outputs.bandit-status == 'passed' && 'PASSED' || 'FAILED' }} |
          | Secret Detection | ${{ needs.security-scans.outputs.secret-scan-status == 'success' && 'PASSED' || 'FAILED' }} |
          
          ### Pipeline Summary
          **Overall Status**: ${{ needs.code-quality.result == 'success' && needs.testing.result == 'success' && needs.security-scans.result == 'success' && 'ALL CHECKS PASSED' || 'SOME CHECKS FAILED' }}
          
          ---
          *Pipeline executed for commit: ${{ github.event.pull_request.head.sha }}*
